name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          # Пробуем разные возможные имена файла
          if [ -f "PangoRushBot_full_project.zip" ]; then
            unzip -q "PangoRushBot_full_project.zip" -d project
          elif [ -f "PangoRushBot_full_project (2).zip" ]; then
            unzip -q "PangoRushBot_full_project (2).zip" -d project
          elif [ -f ".github/workflows/PangoRushBot_full_project (2).zip" ]; then
            unzip -q ".github/workflows/PangoRushBot_full_project (2).zip" -d project
          else
            echo "ZIP файл не найден!"
            ls -la
            ls -la .github/workflows/ || true
            exit 1
          fi

      - name: Build Debug APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PangoRushBot-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
